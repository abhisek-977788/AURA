[tool.poetry]
name = "aura"
version = "0.1.0"
description = "Audio-Visual Unnatural Representation Analyzer — deepfake detection platform"
authors = ["AURA Team"]
readme = "README.md"
packages = [
    { include = "packages/schemas" },
    { include = "packages/common" },
    { include = "packages/security" },
]

[tool.poetry.dependencies]
python = "^3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
