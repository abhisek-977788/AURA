version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: aura-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aura-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aura-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: aura-api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://aura:aura@postgres:5432/aura
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=aura-evidence
      - SECRET_KEY=development-secret-key-change-in-production
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost:3000,http://forensics-portal:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker-normalization:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    command: python -m services.normalization.consumer
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy

  worker-quality:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    command: python -m services.quality.consumer
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy

  worker-audio:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    command: python -m services.audio_inference.worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy

  worker-video:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    command: python -m services.video_inference.worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy

  worker-fusion:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    command: python -m services.fusion.worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://aura:aura@postgres:5432/aura
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-alerts:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    command: python -m services.alerts.worker
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy

  worker-evidence:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    command: python -m services.evidence.worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://aura:aura@postgres:5432/aura
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=aura-evidence
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-audit:
    build:
      context: ../..
      dockerfile: infrastructure/docker/worker.Dockerfile
    command: python -m services.audit.worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://aura:aura@postgres:5432/aura
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
