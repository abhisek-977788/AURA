"""
AURA packages/schemas — pyproject.toml

Installed as editable package so all services can import from packages.schemas.
"""
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura-schemas"
version = "0.1.0"
description = "AURA shared Pydantic schemas"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
